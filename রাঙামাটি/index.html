<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>রাঙামাটি | ভ্রমণের স্মৃতি</title><style>
:root{--ink:#172b4d;--muted:#62748a;--line:#dbe4ee;--blue:#1769aa;--paper:#f5f8fc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}header{padding:24px 16px;background:linear-gradient(135deg,#102a43,#1769aa);color:#fff}header>div,main{max-width:1100px;margin:auto}.back{color:#e3f0fb;text-decoration:none;font-size:14px}h1{margin:18px 0 4px;font-size:clamp(25px,5vw,36px)}header p{margin:0;color:#dce9f5}main{padding:20px 16px 45px}.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.btn{border:0;border-radius:10px;background:var(--blue);color:white;padding:10px 14px;font-weight:650;font-size:14px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.light{background:#e5eff9;color:#174d7a}.count{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.item{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.item .visual{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:#e8eef5}.visual img,.visual video{display:block;width:100%;height:100%;object-fit:cover}.visual audio{width:92%}.visual .heic{padding:12px;text-align:center;font-size:13px;color:var(--muted)}.meta{padding:10px}.meta label{display:flex;gap:8px;align-items:center;font-size:13px}.meta input{margin:0}.download-one{display:block;margin-top:8px;color:#1769aa;font-size:13px;text-decoration:none}.empty{padding:24px;border:1px dashed #b8c9da;border-radius:14px;background:#fff;color:var(--muted);line-height:1.8}.hint{margin-top:20px;color:var(--muted);font-size:13px;line-height:1.8}.viewer{display:none;position:fixed;inset:0;background:#071421f2;z-index:5;align-items:center;justify-content:center;padding:18px}.viewer.open{display:flex}.viewer img,.viewer video{max-width:100%;max-height:88vh;object-fit:contain}.close{position:absolute;top:15px;right:15px;background:white;color:#172b4d;border:0;border-radius:9px;padding:10px 14px}
</style></head><body><header><div><a class="back" href="../">← সব অ্যালবাম</a><h1>রাঙামাটি</h1><p>ছবি · ভিডিও · অডিও</p></div></header><main><div class="tools"><button id="selectAll" class="btn light" disabled>সব নির্বাচন</button><button id="download" class="btn" disabled>নির্বাচিত ফাইল ডাউনলোড</button><span id="count" class="count">মিডিয়া খোঁজা হচ্ছে…</span></div><div id="gallery" class="grid"></div><p class="hint">কোনো ফাইলের নাম দেখানো হয় না। ছবি/ভিডিওতে চাপ দিলে বড় করে দেখা যাবে। HEIC ফাইল ব্রাউজারে না খুললে ডাউনলোড করে HEIC-সমর্থিত অ্যাপে খুলুন। একাধিক ফাইল ডাউনলোডে ব্রাউজারের অনুমতি লাগতে পারে।</p></main><div class="viewer" id="viewer"><button class="close" id="close">বন্ধ করুন</button><div id="large"></div></div>
<script>
const owner='fahim618900-wq',repo='ftour26',branch='main',folder='%E0%A6%B0%E0%A6%BE%E0%A6%99%E0%A6%BE%E0%A6%9F%E0%A6%AE%E0%A6%BE%E0%A6%9F%E0%A6%BF';const gallery=document.getElementById('gallery'),count=document.getElementById('count'),selectAll=document.getElementById('selectAll'),download=document.getElementById('download');const ext=f=>(f.name.split('.').pop()||'').toLowerCase();const kind=f=>{const e=ext(f);if(['jpg','jpeg','png','gif','webp','avif','bmp','heic','heif'].includes(e))return'image';if(['mp4','mov','webm','m4v','ogv'].includes(e))return'video';if(['mp3','m4a','wav','ogg','oga','aac','flac'].includes(e))return'audio';return''};let files=[];
function update(){const b=[...document.querySelectorAll('.pick')],n=b.filter(x=>x.checked).length;count.textContent=files.length+'টি মিডিয়া · নির্বাচিত '+n+'টি';download.disabled=n===0;selectAll.disabled=files.length===0;selectAll.textContent=n===b.length&&b.length?'নির্বাচন বাতিল':'সব নির্বাচন'}
function showLarge(file,k){const v=document.getElementById('viewer'),area=document.getElementById('large');area.innerHTML='';let el;if(k==='image'&&!['heic','heif'].includes(ext(file))){el=document.createElement('img');el.src=file.download_url;el.alt=''}else if(k==='video'){el=document.createElement('video');el.src=file.download_url;el.controls=true;el.autoplay=true}else{const a=document.createElement('a');a.href=file.download_url;a.className='btn';a.textContent='ফাইল ডাউনলোড করুন';a.download='media-file';area.append(a);v.classList.add('open');return}area.append(el);v.classList.add('open')}
async function load(){try{const r=await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+folder+'?ref='+branch);if(!r.ok)throw Error();files=(await r.json()).filter(f=>f.type==='file'&&kind(f));if(!files.length){gallery.innerHTML='<div class="empty">এই অ্যালবামে এখনো মিডিয়া নেই। GitHub-এ MP3, MP4, HEIC, PNG, JPG অথবা JPEG, WebP, GIF, MOV, WebM, M4A, WAV, OGG ইত্যাদি ফাইল আপলোড করুন। যেকোনো ফাইলনাম দিতে পারেন।</div>';count.textContent='0টি মিডিয়া';return}
files.forEach((file,i)=>{const k=kind(file),card=document.createElement('article');card.className='item';const visual=document.createElement('div');visual.className='visual';let el;if(k==='image'&&!['heic','heif'].includes(ext(file))){el=document.createElement('img');el.src=file.download_url;el.alt='';el.loading='lazy';el.addEventListener('click',()=>showLarge(file,k))}else if(k==='video'){el=document.createElement('video');el.src=file.download_url;el.controls=true;el.preload='metadata';el.setAttribute('aria-label','ভিডিও')}else if(k==='audio'){el=document.createElement('audio');el.src=file.download_url;el.controls=true;el.preload='none';el.setAttribute('aria-label','অডিও')}else{el=document.createElement('div');el.className='heic';el.textContent='HEIC ছবি';el.addEventListener('click',()=>showLarge(file,k))}visual.append(el);const meta=document.createElement('div');meta.className='meta';const label=document.createElement('label'),box=document.createElement('input'),t=document.createElement('span');box.type='checkbox';box.className='pick';box.value=file.download_url;box.addEventListener('change',update);t.textContent='নির্বাচন করুন';label.append(box,t);const a=document.createElement('a');a.className='download-one';a.href=file.download_url;a.download='media-'+(i+1)+'.'+ext(file);a.textContent='ডাউনলোড';meta.append(label,a);card.append(visual,meta);gallery.append(card)});update()}catch(e){gallery.innerHTML='<div class="empty">মিডিয়া লোড করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।</div>';count.textContent='লোড হয়নি'}}
selectAll.addEventListener('click',()=>{const b=[...document.querySelectorAll('.pick')],all=b.every(x=>x.checked);b.forEach(x=>x.checked=!all);update()});download.addEventListener('click',()=>{[...document.querySelectorAll('.pick:checked')].forEach((box,i)=>{const a=document.createElement('a');a.href=box.value;a.download='media-'+(i+1);a.rel='noopener';document.body.append(a);setTimeout(()=>{a.click();a.remove()},i*500)})});document.getElementById('close').addEventListener('click',()=>document.getElementById('viewer').classList.remove('open'));document.getElementById('viewer').addEventListener('click',e=>{if(e.target.id==='viewer')e.currentTarget.classList.remove('open')});load();
</script></body></html>
