<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>কক্সবাজার | ভ্রমণের ছবি</title><style>
:root{--ink:#172b4d;--muted:#62748a;--line:#dbe4ee;--blue:#1769aa;--paper:#f5f8fc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}header{padding:24px 16px;background:linear-gradient(135deg,#102a43,#1769aa);color:#fff}header>div,main{max-width:1100px;margin:auto}.back{color:#e3f0fb;text-decoration:none;font-size:14px}h1{margin:18px 0 4px;font-size:clamp(25px,5vw,36px)}header p{margin:0;color:#dce9f5}main{padding:20px 16px 45px}.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.btn{border:0;border-radius:10px;background:var(--blue);color:white;padding:10px 14px;font-weight:650;font-size:14px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.light{background:#e5eff9;color:#174d7a}.count{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.photo{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#e8eef5;cursor:pointer}.photo .meta{padding:10px}.photo label{display:flex;gap:8px;align-items:center;font-size:13px}.photo input{margin:0}.photo .download-one{display:block;margin-top:8px;color:#1769aa;font-size:13px;text-decoration:none}.empty{padding:24px;border:1px dashed #b8c9da;border-radius:14px;background:#fff;color:var(--muted);line-height:1.8}.hint{margin-top:20px;color:var(--muted);font-size:13px;line-height:1.8}.viewer{display:none;position:fixed;inset:0;background:#071421f2;z-index:5;align-items:center;justify-content:center;padding:18px}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:88vh;object-fit:contain}.close{position:absolute;top:15px;right:15px;background:white;color:#172b4d;border:0;border-radius:9px;padding:10px 14px}</style></head><body><header><div><a class="back" href="../">← সব অ্যালবাম</a><h1>কক্সবাজার</h1><p>ভ্রমণের ছবি</p></div></header><main><div class="tools"><button id="selectAll" class="btn light" disabled>সব নির্বাচন</button><button id="download" class="btn" disabled>নির্বাচিত ছবি ডাউনলোড</button><span id="count" class="count">ছবি খোঁজা হচ্ছে…</span></div><div id="gallery" class="grid"></div><p class="hint">ছবির নাম দেখানো হবে না। একাধিক ছবি নির্বাচন করে আলাদাভাবে ডাউনলোড করতে পারবেন। ব্রাউজার একাধিক ডাউনলোডের অনুমতি চাইতে পারে।</p></main><div class="viewer" id="viewer"><button class="close" id="close">বন্ধ করুন</button><img id="large" alt="ভ্রমণের ছবি"></div>
<script>
const owner='fahim618900-wq',repo='ftour26',branch='main',folder='%E0%A6%95%E0%A6%95%E0%A7%8D%E0%A6%B8%E0%A6%AC%E0%A6%BE%E0%A6%9C%E0%A6%BE%E0%A6%B0';const gallery=document.getElementById('gallery'),count=document.getElementById('count'),selectAll=document.getElementById('selectAll'),download=document.getElementById('download');const imageFile=f=>/\.(jpe?g|png|gif|webp|avif|bmp)$/i.test(f.name||'');let photos=[];
function update(){const boxes=[...document.querySelectorAll('.pick')],n=boxes.filter(x=>x.checked).length;count.textContent=photos.length+'টি ছবি · নির্বাচিত '+n+'টি';download.disabled=n===0;selectAll.disabled=photos.length===0;selectAll.textContent=n===boxes.length&&boxes.length?'নির্বাচন বাতিল':'সব নির্বাচন'}
async function load(){try{const r=await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+folder+'?ref='+branch);if(!r.ok)throw Error();const files=await r.json();photos=files.filter(f=>f.type==='file'&&imageFile(f));if(!photos.length){gallery.innerHTML='<div class="empty">এই অ্যালবামে এখনো ছবি নেই। GitHub-এ এই ফোল্ডারে JPG, JPEG, PNG, GIF, WebP বা AVIF ছবি আপলোড করুন। যেকোনো ফাইলনাম ব্যবহার করতে পারেন। আপলোডের পর পেজ রিফ্রেশ করুন।</div>';count.textContent='0টি ছবি';return}
photos.forEach((photo,i)=>{const card=document.createElement('article');card.className='photo';const img=document.createElement('img');img.src=photo.download_url;img.alt='ভ্রমণের ছবি';img.loading='lazy';img.addEventListener('click',()=>{document.getElementById('large').src=photo.download_url;document.getElementById('viewer').classList.add('open')});const meta=document.createElement('div');meta.className='meta';const label=document.createElement('label');const box=document.createElement('input');box.type='checkbox';box.className='pick';box.value=photo.download_url;box.addEventListener('change',update);const t=document.createElement('span');t.textContent='ছবি '+(i+1);label.append(box,t);const a=document.createElement('a');a.className='download-one';a.href=photo.download_url;a.download='travel-photo-'+(i+1)+'.'+(photo.name.split('.').pop()||'jpg');a.textContent='ছবি ডাউনলোড';meta.append(label,a);card.append(img,meta);gallery.append(card)});update()}catch(e){gallery.innerHTML='<div class="empty">ছবি লোড করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার পেজ খুলুন।</div>';count.textContent='ছবি লোড হয়নি'}}
selectAll.addEventListener('click',()=>{const b=[...document.querySelectorAll('.pick')],all=b.every(x=>x.checked);b.forEach(x=>x.checked=!all);update()});download.addEventListener('click',()=>{[...document.querySelectorAll('.pick:checked')].forEach((box,i)=>{const a=document.createElement('a');a.href=box.value;a.download='travel-photo-'+(i+1);a.rel='noopener';document.body.append(a);setTimeout(()=>{a.click();a.remove()},i*500)})});document.getElementById('close').addEventListener('click',()=>document.getElementById('viewer').classList.remove('open'));document.getElementById('viewer').addEventListener('click',e=>{if(e.target.id==='viewer')e.currentTarget.classList.remove('open')});load();
</script></body></html>
