<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><meta name="description" content="সাজেক, রাঙামাটি ও কক্সবাজার ভ্রমণের ছবি, ভিডিও ও অডিও"><title>আমাদের ভ্রমণের স্মৃতি</title>
<style>
:root{--ink:#172b4d;--muted:#62748a;--line:#dbe4ee;--blue:#1769aa;--paper:#f5f8fc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}header{background:linear-gradient(135deg,#102a43,#1769aa);color:#fff;padding:30px 18px 36px}header>div,main{max-width:1100px;margin:auto}h1{font-size:clamp(26px,5vw,38px);margin:0}header p{color:#dce9f5;margin:8px 0 0}main{padding:22px 16px 48px}.intro{color:var(--muted);line-height:1.8;margin:0 0 22px}.places{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.place{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:0 5px 20px #17324d0b;min-width:0}.place h2{font-size:21px;margin:8px 5px}.preview{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.preview img,.preview video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#e5edf5}.preview audio{width:100%;grid-column:span 2}.status{font-size:13px;color:var(--muted);padding:8px 5px;min-height:35px}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:10px;background:var(--blue);color:#fff;padding:10px 15px;font-weight:650;font-size:14px;margin:4px 5px}.note{margin-top:22px;background:#eaf4f7;border:1px solid #cfe5eb;border-radius:14px;padding:15px;color:#245260;line-height:1.8;font-size:14px}footer{text-align:center;color:var(--muted);font-size:13px;padding:18px}
</style></head><body><header><div><h1>আমাদের ভ্রমণের স্মৃতি</h1><p>সাজেক · রাঙামাটি · কক্সবাজার</p></div></header><main>
<section class="places"><article class="place"><div class="preview" id="preview-sajek"></div><h2>সাজেক</h2><div class="status" id="status-sajek">মিডিয়া খোঁজা হচ্ছে…</div><a class="btn" href="./Sajek/">অ্যালবাম খুলুন</a></article>
<article class="place"><div class="preview" id="preview-rangamati"></div><h2>রাঙামাটি</h2><div class="status" id="status-rangamati">মিডিয়া খোঁজা হচ্ছে…</div><a class="btn" href="./Rangamati/">অ্যালবাম খুলুন</a></article>
<article class="place"><div class="preview" id="preview-cox"></div><h2>কক্সবাজার</h2><div class="status" id="status-cox">মিডিয়া খোঁজা হচ্ছে…</div><a class="btn" href="./%E0%A6%95%E0%A6%95%E0%A7%8D%E0%A6%B8%E0%A6%AC%E0%A6%BE%E0%A6%জার/">অ্যালবাম খুলুন</a></article></section>
</main><footer>ভ্রমণের স্মৃতি সবার সঙ্গে ভাগ করে নিন</footer>
<script>
const owner='fahim618900-wq',repo='ftour26',branch='main';
const albums=[{path:'Sajek',preview:'preview-sajek',status:'status-sajek'},{path:'Rangamati',preview:'preview-rangamati',status:'status-rangamati'},{path:'CoxsBazar',preview:'preview-cox',status:'status-cox'}];
const ext=f=>(f.name.split('.').pop()||'').toLowerCase();
const kind=f=>{const e=ext(f);if(['jpg','jpeg','png','gif','webp','avif','bmp','heic','heif'].includes(e))return'image';if(['mp4','mov','webm','m4v','ogv'].includes(e))return'video';if(['mp3','m4a','wav','ogg','oga','aac','flac'].includes(e))return'audio';return''};
async function loadAlbum(a){const box=document.getElementById(a.preview),status=document.getElementById(a.status);try{const r=await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+a.path+'?ref='+branch);if(!r.ok)throw Error();const files=(await r.json()).filter(f=>f.type==='file'&&kind(f));status.textContent=files.length+'টি মিডিয়া ফাইল';files.slice(0,4).forEach(f=>{const k=kind(f),url=f.download_url;let el;if(k==='image'&& !['heic','heif'].includes(ext(f))){el=document.createElement('img');el.src=url;el.alt='';el.loading='lazy'}else if(k==='video'){el=document.createElement('video');el.src=url;el.controls=true;el.preload='metadata';el.setAttribute('aria-label','ভিডিও')}else if(k==='audio'){el=document.createElement('audio');el.src=url;el.controls=true;el.preload='none';el.setAttribute('aria-label','অডিও')}else{el=document.createElement('a');el.href=url;el.className='btn';el.textContent='HEIC ছবি খুলুন';el.style.fontSize='12px'}box.append(el)});if(!files.length)status.textContent='এখনো কোনো মিডিয়া নেই'}catch(e){status.textContent='মিডিয়া লোড হয়নি—আবার চেষ্টা করুন'}}
albums.forEach(loadAlbum);
</script></body></html>
